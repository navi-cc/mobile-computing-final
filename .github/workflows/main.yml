name: Main Pipeline

on:
  push:
    branches:
      - main

jobs:
  main-job:
    name: Main Job
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7

      - name: install dependencies
        run: npm ci

      - name: check code format
        run: npm run format:check

      - name: run linter
        run: npm run lint

      - name: run tests
        run: npm test
